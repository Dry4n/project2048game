<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./img/icon2048.svg">
    <title>2048 game</title>
</head>

<body>
    <div class="overlay hidden" id="overlay"></div>
    <div class="gameFrame" id="gameFrame">
        <div class="scoreBoard" id="scoreBoard"></div>
        <div class="board">
            <div class="boardRow">
                <div class="tile" id="00"></div>
                <div class="tile" id="01"></div>
                <div class="tile" id="02"></div>
                <div class="tile" id="03"></div>
            </div>
            <div class="boardRow">
                <div class="tile" id="10"></div>
                <div class="tile" id="11"></div>
                <div class="tile" id="12"></div>
                <div class="tile" id="13"></div>
            </div>
            <div class="boardRow">
                <div class="tile" id="20"></div>
                <div class="tile" id="21"></div>
                <div class="tile" id="22"></div>
                <div class="tile" id="23"></div>
            </div>
            <div class="boardRow">
                <div class="tile" id="30"></div>
                <div class="tile" id="31"></div>
                <div class="tile" id="32"></div>
                <div class="tile" id="33"></div>
            </div>
        </div>
        <div class="gameOver hidden" id="gameOver">
            <h1>Game Over</h1>
            <button id="retry" class="retry">Try again</button>
        </div>
        <div class="victory hidden" id="victory">
            <h1>💎 Victory! 💎</h1>
            <p>You reached 2048</p>
            <div class="victoryButtons">
                <button id="restart" class="retry">Restart</button>
                <button id="continue" class="retry">Continue</button>
            </div>
        </div>
    </div>
    <div class="resetBoard" id="resetBoard">
        <button class="resetBtn" id="restartBtn">↺</button>
    </div>

    <script src="game.js"></script>
</body>

</html>
